<div class="strip" [class.strip--disabled]="isDisabled()" [attr.aria-disabled]="isDisabled()">
  <div class="strip__head">
    <span class="strip__label">Doctor's day</span>

    @if (!isDisabled()) {
      <span class="strip__range">{{ rangeLabel() }}</span>
    }
  </div>

  <div #track class="strip__track" (click)="onTrackClick($any($event))">
    @for (slot of busySlots(); track slot.startMinutes) {
      <span class="strip__busy" [style.left.%]="leftPercent(slot.startMinutes)" [style.width.%]="widthPercent(slot.endMinutes - slot.startMinutes)"></span>
    }

    @if (!isDisabled()) {
      <span
        class="strip__pick"
        role="slider"
        tabindex="0"
        aria-label="Appointment start time"
        [attr.aria-valuetext]="startLabel()"
        [attr.aria-valuenow]="startMinutes()"
        [attr.aria-valuemin]="480"
        [attr.aria-valuemax]="960"
        [class.strip__pick--clash]="clash()"
        [style.left.%]="leftPercent(startMinutes())"
        [style.width.%]="widthPercent(durationMinutes())"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (click)="$event.stopPropagation()"
        (keydown.arrowleft)="shift(-1); $event.preventDefault()"
        (keydown.arrowright)="shift(1); $event.preventDefault()"></span>
    }
  </div>

  <div class="strip__ticks">
    <span>08:00</span>
    <span>10:00</span>
    <span>12:00</span>
    <span>14:00</span>
    <span>16:00</span>
  </div>

  <p class="strip__clash" aria-live="polite">
    @if (isDisabled()) {
      Choose a doctor to see their day.
    } @else if (clash()) {
      Already booked in that slot.
    }
  </p>
</div>
