<header class="today__header">
  <div class="today__heading">
    <h1 class="today__title">{{ dayLabel() }}</h1>

    @if (isToday()) {
      <p class="today__subtitle">Today</p>
    }
  </div>

  <nav class="today__days" aria-label="Change day">
    <button matIconButton type="button" aria-label="Previous day" (click)="shiftDay(-1)">
      <mat-icon>chevron_left</mat-icon>
    </button>

    @if (!isToday()) {
      <button matButton type="button" (click)="goToToday()">Today</button>
    }

    <button matIconButton type="button" aria-label="Next day" (click)="shiftDay(1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </nav>
</header>

@if (appointmentsResource.isLoading()) {
  <app-appointment-card-shimmer />
} @else if (appointmentsResource.error(); as error) {
  <app-appointments-list-error-state [message]="error.message" (retry)="appointmentsResource.reload()" />
} @else {
  @let appointmentList = appointments();

  @if (appointmentList.length) {
    <app-appointments-list [data]="appointmentList" />

    @if (total() > perPage()) {
      <app-pagination [(page)]="page" [total]="total()" [pageSize]="perPage()" />
    }
  } @else {
    <app-appointments-list-empty-state [day]="dayLabel()" />
  }
}
