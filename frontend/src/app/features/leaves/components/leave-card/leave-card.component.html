@let leave = item();

<article class="leave-card">
  <button class="leave-card__open" type="button" (click)="open.emit(leave)">
    <app-avatar class="leave-card__avatar" [fileName]="leave.profileImage" [name]="leave.fullname" />

    <span class="leave-card__body">
      <span class="leave-card__name">{{ leave.fullname }}</span>
      <span class="leave-card__when">{{ periodLabel() }}</span>
    </span>

    <span class="leave-card__status" [style.background-color]="statusChip().container" [style.color]="statusChip().onContainer">
      <mat-icon class="leave-card__status-icon">{{ statusChip().icon }}</mat-icon>
      {{ statusChip().label }}
    </span>
  </button>

  @if (canDecide()) {
    <div class="leave-card__actions">
      <button class="leave-card__danger" matButton type="button" (click)="reject.emit(leave)">Reject</button>

      <button matButton="filled" type="button" (click)="approve.emit(leave)">Approve</button>
    </div>
  }
</article>
