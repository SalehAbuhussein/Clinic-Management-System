<h2 class="diagnosis-form__title" matDialogTitle>{{ existing() ? 'Edit diagnosis' : 'Add diagnosis' }}</h2>

<div class="diagnosis-form__content" matDialogContent>
  <p class="diagnosis-form__who">{{ visit.patientName }} with {{ visit.doctorName }}</p>

  @if (isLoading()) {
    <p class="diagnosis-form__loading" role="status">
      <mat-progress-spinner diameter="20" mode="indeterminate" />
      Checking for a diagnosis…
    </p>
  } @else {
    <mat-form-field>
      <mat-label>Diagnosis</mat-label>
      <textarea matInput rows="3" maxlength="255" [(ngModel)]="diagnosis"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Notes</mat-label>
      <textarea matInput rows="3" maxlength="255" [(ngModel)]="notes"></textarea>
      <mat-hint>Optional</mat-hint>
    </mat-form-field>
  }
</div>

@if (error(); as message) {
  <p class="diagnosis-form__error" role="alert">
    <mat-icon>error</mat-icon>
    {{ message }}
  </p>
}

<div class="diagnosis-form__actions" matDialogActions>
  <button matButton type="button" matDialogClose [disabled]="isSaving()">Cancel</button>

  <button matButton="filled" type="button" [disabled]="isLoading() || !canSave() || isSaving()" (click)="saveDiagnosis()">
    @if (isSaving()) {
      <mat-progress-spinner class="diagnosis-form__spinner" diameter="18" mode="indeterminate" />
    }

    Save diagnosis
  </button>
</div>
