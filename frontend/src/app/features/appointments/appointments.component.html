<header class="appointments__header">
  <h1 class="appointments__title">{{ rangeLabel() }}</h1>

  <div class="appointments__controls">
    <app-date-range-picker [(from)]="from" [(to)]="to" />
    <app-export-button path="/Appointments/export" [filters]="exportFilters()" askForRange />
  </div>
</header>

@if (appointmentsResource.isLoading()) {
  <p class="appointments__state" role="status">Loading appointments…</p>
  <app-appointment-card-shimmer />
} @else if (appointmentsResource.error(); as error) {
  <app-appointments-list-error-state [message]="error.message" (retry)="appointmentsResource.reload()" />
} @else {
  @let appointmentList = appointments();

  @if (appointmentList.length) {
    <app-appointments-list [data]="appointmentList" (open)="openAppointment($event)" />

    @if (total() > perPage()) {
      <app-pagination [(page)]="page" [total]="total()" [pageSize]="perPage()" />
    }
  } @else {
    <app-appointments-list-empty-state [day]="rangeLabel()" [canBook]="authService.isFrontDesk()" (book)="openBookingDialog()" />
  }
}
