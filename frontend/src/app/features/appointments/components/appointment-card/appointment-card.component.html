<button
  class="appointment"
  type="button"
  (click)="open.emit(item())"
  [style.--card-accent]="statusChip().accent"
  [class.appointment--not-attended]="item().status === Status.NoShow"
  [class.appointment--cancelled]="item().status === Status.Cancelled">
  <span class="appointment__time">{{ item().startAt | date: 'h:mm a' }}</span>

  <span class="appointment__who">
    <span class="appointment__patient">{{ item().patientName }}</span>
    <span class="appointment__meta">{{ item().doctorName }}</span>
  </span>

  <span
    class="appointment__status"
    [style.--status-container]="statusChip().container"
    [style.--status-on-container]="statusChip().onContainer">
    <mat-icon>{{ statusChip().icon }}</mat-icon>
    {{ statusChip().label }}
  </span>
</button>
