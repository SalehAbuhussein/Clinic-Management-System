<div
  class="appointment"
  (click)="openMenu()"
  [style.--card-accent]="status().accent"
  [class.appointment--not-attended]="item().status === 2"
  [class.appointment--cancelled]="item().status === 3">
  <span class="appointment__time">{{ item().startAt | date: 'HH:mm' }}</span>

  <span class="appointment__who">
    <span class="appointment__patient">{{ item().patientName }}</span>
    <span class="appointment__meta">{{ item().doctorName }}</span>
  </span>

  <span
    class="appointment__status"
    [style.--status-container]="status().container"
    [style.--status-on-container]="status().onContainer">
    <mat-icon>{{ status().icon }}</mat-icon>
    {{ status().label }}
  </span>

  @if (hasActions()) {
    <button
      class="appointment__actions"
      matIconButton
      type="button"
      aria-label="Appointment actions"
      [matMenuTriggerFor]="menu"
      (click)="$event.stopPropagation()">
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      @if (isScheduled()) {
        <button mat-menu-item type="button" (click)="attend.emit(item().id)">
          <mat-icon>check_circle</mat-icon>
          Mark attended
        </button>

        <button mat-menu-item type="button" (click)="noShow.emit(item().id)">
          <mat-icon>person_off</mat-icon>
          Mark no-show
        </button>

        <button mat-menu-item type="button" (click)="reschedule.emit(item())">
          <mat-icon>edit_calendar</mat-icon>
          Reschedule
        </button>

        <button mat-menu-item type="button" (click)="cancel.emit(item().id)">
          <mat-icon>event_busy</mat-icon>
          Cancel appointment
        </button>
      }
    </mat-menu>
  }
</div>
