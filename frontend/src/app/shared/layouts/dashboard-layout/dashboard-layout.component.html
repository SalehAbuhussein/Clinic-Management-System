<div class="dashboard-container">
  <nav class="dashboard-side">
    @if (authService.isFrontDesk()) {
      <button class="dashboard-side__book" (click)="openBookingDialog()" matFab extended>
        <mat-icon class="dashboard-side__book-icon">add</mat-icon>
        <span class="dashboard-side__book-label">Book</span>
      </button>
    }

    <mat-nav-list class="dashboard-side__nav">
      @if (authService.isAdmin()) {
        <a
          class="dashboard-side__link"
          mat-list-item
          routerLink="/dashboard/stats"
          routerLinkActive
          #stats="routerLinkActive"
          [activated]="stats.isActive">
          <mat-icon class="dashboard-side__icon" matListItemIcon>insights</mat-icon>
          <span class="dashboard-side__label" matListItemTitle>Stats</span>
        </a>

        <a
          class="dashboard-side__link"
          mat-list-item
          routerLink="/dashboard/users"
          routerLinkActive
          #users="routerLinkActive"
          [activated]="users.isActive">
          <mat-icon class="dashboard-side__icon" matListItemIcon>manage_accounts</mat-icon>
          <span class="dashboard-side__label" matListItemTitle>Users</span>
        </a>
      }

      @if (authService.isFrontDesk()) {
        <a
          class="dashboard-side__link"
          mat-list-item
          routerLink="/dashboard"
          routerLinkActive
          #today="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [activated]="today.isActive">
          <mat-icon class="dashboard-side__icon" matListItemIcon>today</mat-icon>
          <span class="dashboard-side__label" matListItemTitle>Today</span>
        </a>

        <a
          class="dashboard-side__link"
          mat-list-item
          routerLink="/dashboard/patients"
          routerLinkActive
          #patients="routerLinkActive"
          [activated]="patients.isActive">
          <mat-icon class="dashboard-side__icon" matListItemIcon>groups</mat-icon>
          <span class="dashboard-side__label" matListItemTitle>Patients</span>
        </a>

      }

      <a
        class="dashboard-side__link"
        mat-list-item
        routerLink="/dashboard/visits"
        routerLinkActive
        #visits="routerLinkActive"
        [activated]="visits.isActive">
        <mat-icon class="dashboard-side__icon" matListItemIcon>assignment</mat-icon>
        <span class="dashboard-side__label" matListItemTitle>
          {{ authService.role() === 'Doctor' ? 'My patients' : 'Visits' }}
        </span>
      </a>
    </mat-nav-list>

    <mat-nav-list class="dashboard-side__nav dashboard-side__footer">
      <a class="dashboard-side__link" mat-list-item (click)="logout()">
        <mat-icon class="dashboard-side__icon" matListItemIcon>logout</mat-icon>
        <span class="dashboard-side__label" matListItemTitle>Sign out</span>
      </a>
    </mat-nav-list>
  </nav>

  <main class="dashboard-main-content">
    <router-outlet></router-outlet>
  </main>
</div>
